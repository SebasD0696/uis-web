<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visor RGB + Máscaras de segmentación</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/styles.css">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script defer src="js/config.js"></script>
<script defer src="js/map-view.js"></script>
<script defer src="js/stats.js"></script>
<script defer src="js/controls.js"></script>
<script defer src="js/main.js"></script>
</head>
<body>
<div id="map" role="application" aria-label="Mapa de cobertura arbórea"></div>

<button id="panelToggle" type="button" aria-controls="topPanels" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
    <line x1="4" y1="21" x2="4" y2="14"></line>
    <line x1="4" y1="10" x2="4" y2="3"></line>
    <line x1="12" y1="21" x2="12" y2="12"></line>
    <line x1="12" y1="8" x2="12" y2="3"></line>
    <line x1="20" y1="21" x2="20" y2="16"></line>
    <line x1="20" y1="12" x2="20" y2="3"></line>
    <line x1="1" y1="14" x2="7" y2="14"></line>
    <line x1="9" y1="8" x2="15" y2="8"></line>
    <line x1="17" y1="16" x2="23" y2="16"></line>
  </svg>
  <span>Controles</span>
</button>

<div id="sheetBackdrop" aria-hidden="true"></div>

<div id="topPanels">
  <div class="sheet-header">
    <span>Controles y estadísticas</span>
    <button id="sheetClose" type="button" class="sheet-close" aria-label="Cerrar panel">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
        <path d="M6 6l12 12M18 6L6 18"></path>
      </svg>
    </button>
  </div>

  <div id="panel">
    <h3>Máscara de segmentación</h3>
    <div class="row">
      <label>Modelo:</label>
      <div class="model-btns" id="modelBtns">
        <button type="button" class="model-btn active" data-model="b0" aria-pressed="true">SegFormer B0 (Ours)</button>
        <button type="button" class="model-btn" data-model="b5" aria-pressed="false">SegFormer B5</button>
      </div>
    </div>
    <button id="btnMask" type="button" aria-pressed="true">Máscara: activada</button>
    <div class="row">
      <label for="opSlider">Opacidad: <span id="opVal">70%</span></label>
      <input type="range" id="opSlider" min="0" max="100" value="70">
    </div>
    <div class="row">
      <label>Color:</label>
      <div class="swatches" id="swatches">
        <button type="button" class="swatch active" data-filter="none" style="background:#ff0000" title="Rojo" aria-label="Rojo" aria-pressed="true"></button>
        <button type="button" class="swatch" data-filter="hue-rotate(120deg) saturate(1.1)" style="background:#00ff00" title="Verde" aria-label="Verde" aria-pressed="false"></button>
        <button type="button" class="swatch" data-filter="hue-rotate(240deg)" style="background:#0000ff" title="Azul" aria-label="Azul" aria-pressed="false"></button>
        <button type="button" class="swatch" data-filter="hue-rotate(60deg) saturate(1.3)" style="background:#ffff00" title="Amarillo" aria-label="Amarillo" aria-pressed="false"></button>
      </div>
    </div>
  </div>

  <div id="stats">
    <div class="stats-brand">
      <img src="logo/LogoDefinitivoBlanco.png" alt="Logo del proyecto">
    </div>
    <h3>Estadísticas de cobertura arbórea</h3>
    <div class="note" id="statsModel">Modelo: SegFormer B0 (Ours)</div>
    <table>
      <thead><tr><th>Año</th><th>Cobertura</th><th>Área arbolada</th></tr></thead>
      <tbody id="statsBody"></tbody>
    </table>
    <div class="note">% sobre el área cubierta por el ortomosaico · GSD real por año</div>
  </div>
</div>

<div id="timeline" role="group" aria-label="Año del mapa">
  <button type="button" class="year-btn active" data-year="2016" aria-pressed="true"><span class="dot"></span><span class="label">2016</span></button>
  <div class="track-line"></div>
  <button type="button" class="year-btn" data-year="2021" aria-pressed="false"><span class="dot"></span><span class="label">2021</span></button>
  <div class="track-line"></div>
  <button type="button" class="year-btn" data-year="2023" aria-pressed="false"><span class="dot"></span><span class="label">2023</span></button>
  <div class="track-line"></div>
  <button type="button" class="year-btn" data-year="2025" aria-pressed="false"><span class="dot"></span><span class="label">2025</span></button>
</div>
</body>
</html>
