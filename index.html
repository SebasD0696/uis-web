<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor RGB + Máscaras de segmentación</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body, #map { height: 100%; margin: 0; }

  #panel {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1000;
    background: #fff;
    border-radius: 8px;
    padding: 10px 14px;
    font: 13px/1.5 system-ui, sans-serif;
    box-shadow: 0 1px 5px rgba(0,0,0,.4);
    max-width: 220px;
  }
  #panel h3 { margin: 0 0 6px; font-size: 14px; }
  #panel .row { margin: 6px 0; }
  #panel input[type="range"] { width: 100%; }
  #panel .swatches { display: flex; gap: 6px; margin-top: 4px; }
  #panel .swatch {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #ccc; cursor: pointer;
  }
  #panel .swatch.active { border-color: #222; }

  #btnMask {
    display: block;
    width: 100%;
    padding: 8px 10px;
    margin-bottom: 4px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    background: #1976d2;
    transition: background .2s;
  }
  #btnMask.off { background: #9e9e9e; }

  #panel .model-btns { display: flex; gap: 4px; margin-top: 4px; }
  #panel .model-btn {
    flex: 1;
    padding: 6px 4px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
  }
  #panel .model-btn.active {
    background: #1976d2;
    border-color: #1976d2;
    color: #fff;
    font-weight: 700;
  }

  #stats {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 1000;
    background: #fff;
    border-radius: 8px;
    padding: 10px 14px;
    font: 13px/1.5 system-ui, sans-serif;
    box-shadow: 0 1px 5px rgba(0,0,0,.4);
    min-width: 250px;
  }
  #stats h3 { margin: 0 0 6px; font-size: 14px; }
  #stats table { width: 100%; border-collapse: collapse; }
  #stats th { text-align: left; font-size: 12px; color: #555; padding: 2px 6px; }
  #stats td { padding: 3px 6px; border-top: 1px solid #eee; }
  #stats tr.active td { background: #e3f2fd; font-weight: 600; }
  #stats .note { font-size: 11px; color: #888; margin-top: 6px; }

  #timeline {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    align-items: center;
    background: #fff;
    border-radius: 24px;
    padding: 10px 16px;
    box-shadow: 0 1px 5px rgba(0,0,0,.4);
  }
  #timeline .year-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    padding: 4px 10px;
    user-select: none;
  }
  #timeline .year-btn .dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #ccc;
    box-shadow: 0 0 0 2px #bbb;
    transition: all .2s;
  }
  #timeline .year-btn .label {
    font: 12px/1 system-ui, sans-serif;
    color: #555;
    margin-top: 5px;
    transition: color .2s;
  }
  #timeline .year-btn.active .dot {
    background: #1976d2;
    box-shadow: 0 0 0 2px #1976d2;
    transform: scale(1.2);
  }
  #timeline .year-btn.active .label { color: #1976d2; font-weight: 700; }
  #timeline .track-line {
    width: 26px; height: 2px;
    background: #ddd;
  }

  @media (max-width: 700px) {
    #topPanels {
      position: absolute;
      top: 6px; left: 6px; right: 6px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 38vh;
      overflow-y: auto;
    }
    #topPanels #stats,
    #topPanels #panel {
      position: static;
      min-width: 0;
      max-width: none;
      padding: 5px 8px;
      font-size: 11px;
      border-radius: 6px;
    }
    #stats h3 { font-size: 12px; margin-bottom: 3px; }
    #stats th, #stats td { padding: 1px 3px; font-size: 10px; }
    #stats .note { font-size: 9px; margin-top: 3px; }
    #panel h3 { font-size: 12px; margin-bottom: 3px; }
    #btnMask { font-size: 11px; padding: 5px 8px; }
    #panel .row { margin: 3px 0; }
    #panel .swatches { gap: 4px; margin-top: 2px; }
    #panel .swatch { width: 18px; height: 18px; }
    #panel input[type="range"] { height: 20px; }
    #timeline { bottom: 10px; padding: 8px 12px; }
    #timeline .year-btn { padding: 2px 6px; }
    #timeline .year-btn .dot { width: 12px; height: 12px; }
    #timeline .track-line { width: 18px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="topPanels">
<div id="panel">
  <h3>Máscara de segmentación</h3>
  <div class="row">
    <label>Modelo:</label>
    <div class="model-btns" id="modelBtns">
      <button type="button" class="model-btn active" data-model="b0">SegFormer B0 (Ours)</button>
      <button type="button" class="model-btn" data-model="b5">SegFormer B5</button>
    </div>
  </div>
  <button id="btnMask">Máscara: activada</button>
  <div class="row">
    <label>Opacidad: <span id="opVal">70%</span></label>
    <input type="range" id="opSlider" min="0" max="100" value="70">
  </div>
  <div class="row">
    <label>Color:</label>
    <div class="swatches" id="swatches">
      <div class="swatch active" data-filter="none" style="background:#ff0000" title="Rojo"></div>
      <div class="swatch" data-filter="hue-rotate(120deg) saturate(1.1)" style="background:#00ff00" title="Verde"></div>
      <div class="swatch" data-filter="hue-rotate(240deg)" style="background:#0000ff" title="Azul"></div>
      <div class="swatch" data-filter="hue-rotate(60deg) saturate(1.3)" style="background:#ffff00" title="Amarillo"></div>
    </div>
  </div>
</div>

<div id="stats">
  <h3>Estadísticas de cobertura arbórea</h3>
  <div class="note" id="statsModel">Modelo: SegFormer B0 (Ours)</div>
  <table>
    <thead><tr><th>Año</th><th>Cobertura</th><th>Área arbolada</th></tr></thead>
    <tbody id="statsBody"></tbody>
  </table>
  <div class="note">% sobre el área cubierta por el ortomosaico · GSD real por año</div>
</div>
</div>

<div id="timeline">
  <div class="year-btn active" data-year="2016"><span class="dot"></span><span class="label">2016</span></div>
  <div class="track-line"></div>
  <div class="year-btn" data-year="2021"><span class="dot"></span><span class="label">2021</span></div>
  <div class="track-line"></div>
  <div class="year-btn" data-year="2023"><span class="dot"></span><span class="label">2023</span></div>
  <div class="track-line"></div>
  <div class="year-btn" data-year="2025"><span class="dot"></span><span class="label">2025</span></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const YEARS = ['2016', '2021', '2023', '2025'];
  const MODELS = {
    b0: { label: 'SegFormer B0 (Ours)' },
    b5: { label: 'SegFormer B5' }
  };
  let activeModel = 'b0';

  const STATS = {
    b0: {
      '2016': { gsd_cm: 5.55, arbol_m2: 78972, total_m2: 254263, pct: 31.06 },
      '2021': { gsd_cm: 5.13, arbol_m2: 74391, total_m2: 256542, pct: 29.00 },
      '2023': { gsd_cm: 4.89, arbol_m2: 74247, total_m2: 256216, pct: 28.98 },
      '2025': { gsd_cm: 2.71, arbol_m2: 88973, total_m2: 256338, pct: 34.71 }
    },
    b5: {
      '2016': { gsd_cm: 5.55, arbol_m2: 80719, total_m2: 254263, pct: 31.75 },
      '2021': { gsd_cm: 5.13, arbol_m2: 81734, total_m2: 256542, pct: 31.86 },
      '2023': { gsd_cm: 4.89, arbol_m2: 82966, total_m2: 256216, pct: 32.38 },
      '2025': { gsd_cm: 2.71, arbol_m2: 84983, total_m2: 256338, pct: 33.15 }
    }
  };
  const BOUNDS = {
    '2016': [[7.138961, -73.123408], [7.143090, -73.115698]],
    '2021': [[7.138797, -73.123408], [7.143090, -73.115569]],
    '2023': [[7.138774, -73.123408], [7.143089, -73.115715]],
    '2025': [[7.138803, -73.123408], [7.143089, -73.115622]]
  };

  const map = L.map('map', { minZoom: 10, maxZoom: 20, zoomControl: false });
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  map.createPane('rgbPane');
  map.getPane('rgbPane').style.zIndex = 350;
  map.createPane('maskPane');
  map.getPane('maskPane').style.zIndex = 450;

  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20, attribution: '&copy; OpenStreetMap' });
  const sinFondo = new L.LayerGroup();

  const TRANSPARENT = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';
  const rgbLayers = {};
  const maskLayers = {};
  const maskLayersB5 = {};
  YEARS.forEach(function (y) {
    rgbLayers[y] = L.tileLayer(y + '/rgb/{z}/{x}/{y}.png?v=2', { minZoom: 10, maxZoom: 20, tms: true, pane: 'rgbPane', errorTileUrl: TRANSPARENT });
    maskLayers[y] = L.tileLayer(y + '/mask/{z}/{x}/{y}.png?v=2', { minZoom: 10, maxZoom: 20, tms: true, pane: 'maskPane', errorTileUrl: TRANSPARENT });
    maskLayersB5[y] = L.tileLayer(y + '/mask_segformerb5/{z}/{x}/{y}.png?v=1', { minZoom: 10, maxZoom: 20, tms: true, pane: 'maskPane', errorTileUrl: TRANSPARENT });
  });

  function maskLayerFor(y) {
    return activeModel === 'b5' ? maskLayersB5[y] : maskLayers[y];
  }

  let layerControl = makeLayerControl();
  osm.addTo(map);

  function makeLayerControl() {
    var mobile = window.innerWidth < 700;
    return L.control.layers({ 'OpenStreetMap': osm, 'Sin fondo': sinFondo }, {}, { collapsed: mobile, position: mobile ? 'bottomright' : 'bottomleft' }).addTo(map);
  }
  window.addEventListener('resize', function () {
    var nowCollapsed = window.innerWidth < 700;
    if (nowCollapsed !== layerControl._collapsed) {
      map.removeControl(layerControl);
      layerControl = makeLayerControl();
    }
  });

  let currentYear = '2025';
  let maskOn = true;
  map.addLayer(rgbLayers[currentYear]);
  map.addLayer(maskLayers[currentYear]);

  const swLat = Math.min.apply(null, YEARS.map(function (y) { return BOUNDS[y][0][0]; }));
  const swLng = Math.min.apply(null, YEARS.map(function (y) { return BOUNDS[y][0][1]; }));
  const neLat = Math.max.apply(null, YEARS.map(function (y) { return BOUNDS[y][1][0]; }));
  const neLng = Math.max.apply(null, YEARS.map(function (y) { return BOUNDS[y][1][1]; }));
  map.setView([(swLat + neLat) / 2, (swLng + neLng) / 2], 17);
  map.fitBounds([[swLat, swLng], [neLat, neLng]], { padding: [20, 20] });
  map.setMaxBounds(L.latLngBounds([[swLat, swLng], [neLat, neLng]]).pad(0.2));

  function updateYearUI() {
    document.querySelectorAll('#timeline .year-btn').forEach(function (el) {
      el.classList.toggle('active', el.dataset.year === currentYear);
    });
    document.querySelectorAll('#statsBody tr').forEach(function (el) {
      el.classList.toggle('active', el.dataset.year === currentYear);
    });
  }

  function renderStats() {
    var body = document.getElementById('statsBody');
    var stats = STATS[activeModel];
    body.innerHTML = '';
    YEARS.forEach(function (y) {
      var s = stats[y];
      var tr = document.createElement('tr');
      tr.dataset.year = y;
      tr.innerHTML =
        '<td>' + y + ' <small style="color:#888">(' + s.gsd_cm.toFixed(2) + ' cm/px)</small></td>' +
        '<td>' + s.pct.toFixed(2).replace('.', ',') + ' %</td>' +
        '<td>' + s.arbol_m2.toLocaleString('es-CO') + ' m² (' + (s.arbol_m2 / 10000).toFixed(2).replace('.', ',') + ' ha)</td>';
      body.appendChild(tr);
    });
    document.getElementById('statsModel').textContent = 'Modelo: ' + MODELS[activeModel].label;
    updateYearUI();
  }

  function selectYear(y) {
    if (y === currentYear) return;
    map.removeLayer(rgbLayers[currentYear]);
    if (maskOn) map.removeLayer(maskLayerFor(currentYear));
    currentYear = y;
    map.addLayer(rgbLayers[y]);
    if (maskOn) map.addLayer(maskLayerFor(y));
    updateYearUI();
  }

  function updateMaskBtn() {
    var btn = document.getElementById('btnMask');
    btn.textContent = maskOn ? 'Máscara: activada' : 'Máscara: desactivada';
    btn.classList.toggle('off', !maskOn);
  }

  function toggleMask(force) {
    maskOn = (force === undefined) ? !maskOn : force;
    if (maskOn && !map.hasLayer(maskLayerFor(currentYear))) map.addLayer(maskLayerFor(currentYear));
    if (!maskOn && map.hasLayer(maskLayerFor(currentYear))) map.removeLayer(maskLayerFor(currentYear));
    updateMaskBtn();
  }

  document.querySelectorAll('#timeline .year-btn').forEach(function (el) {
    el.addEventListener('click', function () { selectYear(el.dataset.year); });
  });

  document.getElementById('btnMask').addEventListener('click', function () { toggleMask(); });

  function applyMaskOpacity() {
    var v = document.getElementById('opSlider').value / 100;
    document.getElementById('opVal').textContent = Math.round(v * 100) + '%';
    YEARS.forEach(function (y) {
      maskLayers[y].setOpacity(v);
      maskLayersB5[y].setOpacity(v);
    });
  }
  document.getElementById('opSlider').addEventListener('input', applyMaskOpacity);
  applyMaskOpacity();

  function setModel(m) {
    if (m === activeModel) return;
    var prev = activeModel;
    activeModel = m;
    if (maskOn) {
      var prevLayers = prev === 'b5' ? maskLayersB5 : maskLayers;
      var newLayers = m === 'b5' ? maskLayersB5 : maskLayers;
      if (map.hasLayer(prevLayers[currentYear])) map.removeLayer(prevLayers[currentYear]);
      if (!map.hasLayer(newLayers[currentYear])) map.addLayer(newLayers[currentYear]);
    }
    document.querySelectorAll('#modelBtns .model-btn').forEach(function (el) {
      el.classList.toggle('active', el.dataset.model === activeModel);
    });
    renderStats();
  }

  document.querySelectorAll('#modelBtns .model-btn').forEach(function (el) {
    el.addEventListener('click', function () { setModel(el.dataset.model); });
  });

  document.querySelectorAll('#swatches .swatch').forEach(function (el) {
    el.addEventListener('click', function () {
      document.querySelectorAll('#swatches .swatch').forEach(function (s) { s.classList.remove('active'); });
      el.classList.add('active');
      map.getPane('maskPane').style.filter = el.dataset.filter;
    });
  });

  renderStats();
  updateMaskBtn();
</script>
</body>
</html>
